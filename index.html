<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피구 게임</title>

<style>
@font-face {
  font-family: 'PFStardust';
  src: url('./design/assets/fonts/PFStardust.ttf') format('truetype');
  font-display: block;
}
@font-face {
  font-family: 'PFStardustExtraBold';
  src: url('./design/assets/fonts/PFStardustExtraBold.ttf') format('truetype');
  font-display: block;
}
/* 게임 화면 비율(내부 해상도 1200x800)과 상단 UI 바 높이 예약값 */
:root { --game-ar: 1200 / 800; --ui-h: 48px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; font-family: 'PFStardust', sans-serif; }
#gameCanvas { display: block; width: 100%; height: 100%; border-radius: 12px; border: 1px solid #333; }
#ui { color: #ccc; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: min(100vw, calc((100vh - var(--ui-h)) * var(--game-ar))); max-width: 100vw; }
.hp-group { display:flex; align-items:center; gap:6px; }
.hp-wrap { width: 200px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 4px; position: relative; flex-shrink: 0; }
.hp-num { font-size:11px; color:#aaa; min-width:28px; }
#player-hp-bar { height: 100%; border-radius: 4px; }
#npc-hp-bar { height: 100%; border-radius: 4px; position: absolute; right: 0; }
#status { font-size: 12px; color: #888; text-align: center; }
#overlay { position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,0.72);border-radius:12px;overflow:hidden; }
#overlay h2 { color:#fff;font-size:22px;font-weight:500; }
#overlay p  { color:rgba(255,255,255,0.78);font-size:14px; }
.ov-btn { padding:10px 28px;border:1.5px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.12);color:#fff;border-radius:8px;font-size:15px;cursor:pointer;font-family:'PFStardust',sans-serif;letter-spacing:0.5px; }
.ov-btn:hover { background:rgba(255,255,255,0.28); }
.ov-btn.primary { background:rgba(255,210,90,0.18);border-color:rgba(255,210,90,0.7);color:#FFE3A0; }
.ov-btn.primary:hover { background:rgba(255,210,90,0.32); }
/* 화면에 꽉 차게 — 가로/세로 중 먼저 닿는 쪽 기준, 3:2 비율 유지 */
.wrap { position:relative; width: min(100vw, calc((100vh - var(--ui-h)) * var(--game-ar))); aspect-ratio: var(--game-ar); }

/* 1) 시작 화면 */
.ov-start { gap: 0; padding: 0; flex-direction: column; justify-content: flex-start; align-items: stretch; }
.start-top { height: 30%; overflow:hidden; display:flex; justify-content:center; align-items:flex-end; cursor:pointer; }
.start-top img { display:block; max-width:100%; image-rendering:pixelated; transform:translateY(5%); filter:drop-shadow(0 0 24px rgba(255,210,90,0.25)); }
.start-mid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; cursor:pointer; user-select:none; }
.start-cta { display:flex; flex-direction:column; align-items:center; gap:10px; color:#FFE3A0; font-family:'PFStardust',sans-serif; letter-spacing:4px; font-size:26px; text-shadow:0 0 0 rgba(255,210,90,0); transition:text-shadow 0.18s, transform 0.18s, color 0.18s; }
.start-cta .arrow { font-size:34px; line-height:1; opacity:0.85; transition:transform 0.18s; }
.start-mid:hover .start-cta { color:#fff8d8; text-shadow:0 0 14px rgba(255,210,90,0.9), 0 0 28px rgba(255,210,90,0.55); transform:translateY(-2px); }
.start-mid:hover .start-cta .arrow { transform:translateY(-4px); }
.start-bot { height:30%; overflow:hidden; position:relative; display:flex; justify-content:center; align-items:flex-start; }
.start-bot img { display:block; max-width:100%; image-rendering:pixelated; transform:translateY(5%); }

/* 2) 층 진입 인트로 — 풀블리드: 하단 대사 바(w-full) + 우측 스프라이트 + 움직이는 좌우 화살표 */
#overlay.ov-intro { display:block; padding:0; }
.intro-floor-title { position:absolute; top:22px; left:0; right:0; text-align:center; color:rgba(255,210,90,0.95); font-size:20px; letter-spacing:4px; z-index:2; }

.intro-nav { position:absolute; top:44%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:0; cursor:pointer; color:#fff; font-size:62px; line-height:1; padding:6px 16px; user-select:none; opacity:0.88; text-shadow:0 2px 12px rgba(0,0,0,0.6); transition:color .15s, opacity .15s; z-index:4; font-family:'PFStardust',sans-serif; }
.intro-nav:hover { color:#FFE3A0; opacity:1; }
.intro-nav.left  { left:20px;  animation:nav-bob-left 1.1s ease-in-out infinite; }
.intro-nav.right { right:20px; animation:nav-bob-right 1.1s ease-in-out infinite; }
.intro-nav.hidden { visibility:hidden; }
.intro-nav .nav-label { font-size:15px; letter-spacing:1px; color:#FFE3A0; }
@keyframes nav-bob-left  { 0%,100%{transform:translate(0,-50%);} 50%{transform:translate(-10px,-50%);} }
@keyframes nav-bob-right { 0%,100%{transform:translate(0,-50%);} 50%{transform:translate(10px,-50%);} }

.intro-bottom { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:flex-end; pointer-events:none; }
/* 캐릭터: 고정 높이의 20%(-84px)만 대사 영역이 덮어 상단 80% 노출 */
.intro-sprite { height:420px; width:auto; margin-right:7%; margin-bottom:-84px; position:relative; z-index:1; image-rendering:pixelated; filter:drop-shadow(0 8px 20px rgba(0,0,0,0.55)); animation:intro-sprite-in .32s ease; }
@keyframes intro-sprite-in { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
/* 대사 영역: 검은색에 가까운 회색 패널 + 상단 보더, 텍스트 우측 정렬, 높이 4줄 고정 */
.intro-dialogue { position:relative; z-index:2; width:100%; background:rgba(30,30,32,0.95); border-top:2px solid rgba(255,210,90,0.5); padding:24px 120px 28px 64px; text-align:right; }
.intro-speaker { color:#FFE3A0; font-size:17px; letter-spacing:2px; margin-bottom:8px; }
.intro-text { color:#fff; font-size:21px; line-height:1.6; white-space:pre-line; min-height:6.4em; max-width:1000px; margin-left:auto; }
.intro-dots { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.intro-dots .dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.25); transition:background .15s; }
.intro-dots .dot.on { background:#FFE3A0; }

/* 3) 패배: NPC 대화 무대 */
.floor-title { color:rgba(255,210,90,0.9); font-size:14px; letter-spacing:3px; }
.npc-stage { display:flex; align-items:center; gap:18px; max-width:680px; }
.npc-portrait { width:140px; image-rendering:pixelated; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
.bubble { background:rgba(255,255,255,0.94); color:#1a1a1a; padding:14px 18px; border-radius:14px; font-size:15px; line-height:1.5; max-width:420px; position:relative; white-space:pre-line; }
.bubble::before { content:''; position:absolute; left:-8px; top:24px; border:8px solid transparent; border-right-color:rgba(255,255,255,0.94); border-left:0; }

/* 3) 패배 화면 */
.result-headline { font-size:28px !important; }
.result-headline.lose { color:#FF8B8B; }
.result-headline.win  { color:#FFE3A0; }
.result-sub { margin-top:-6px; }
.btn-row { display:flex; gap:12px; margin-top:6px; }

/* 4) 승리 화면 — 카드 */
.card-hint { color:rgba(255,255,255,0.6) !important; font-size:13px !important; }
.card-row { display:flex; gap:14px; }
.upgrade-card { width:160px; padding:18px 14px; background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.18); border-radius:12px; color:#fff; cursor:pointer; font-family:'PFStardust',sans-serif; transition:transform 0.12s, border-color 0.12s, background 0.12s; display:flex; flex-direction:column; align-items:center; gap:6px; }
.upgrade-card:hover { transform:translateY(-4px); border-color:rgba(255,210,90,0.8); background:rgba(255,210,90,0.12); }
.card-emoji { font-size:32px; }
.card-title { font-size:15px; font-weight:600; }
.card-desc  { font-size:12px; color:rgba(255,255,255,0.7); }
.card-desc b { color:#FFE3A0; }
.buff-status { font-size:11px; color:rgba(255,255,255,0.45); letter-spacing:0.5px; }

/* 5) 엔딩 화면 — 탑 정복 + 최종 스탯 */
.final-panel { width:300px; padding:16px 20px; background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,210,90,0.4); border-radius:12px; display:flex; flex-direction:column; gap:8px; }
.final-panel-title { color:#FFE3A0; font-size:13px; letter-spacing:2px; text-align:center; margin-bottom:4px; }
.stat-row { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#eee; }
.stat-name { color:rgba(255,255,255,0.82); }
.stat-val { font-family:'PFStardustExtraBold','PFStardust',sans-serif; color:#fff; }
.stat-bonus { color:#9BE88B; font-size:12px; margin-left:4px; }
.final-buff-count { margin-top:6px; text-align:center; font-size:11px; color:rgba(255,255,255,0.5); letter-spacing:0.5px; }
.final-playtime { text-align:center; font-size:13px; color:rgba(255,220,100,0.85); letter-spacing:0.5px; margin-top:2px; }
/* 엔딩 컷신 */
.cine-stage { display:flex; flex-direction:column; align-items:center; gap:20px; max-width:560px; padding:8px 24px; animation:cine-in 0.35s ease; }
@keyframes cine-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.cine-emoji { font-size:80px; line-height:1; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
.cine-img { width:160px; image-rendering:pixelated; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
.cine-caption { font-size:16px; line-height:1.6; text-align:center; white-space:pre-line; max-width:480px; }
.cine-caption.narr { color:rgba(255,255,255,0.78); font-style:italic; }
.cine-caption.speech { color:#fff; }
.cine-speaker { display:block; color:#FFE3A0; font-size:12px; letter-spacing:1px; margin-bottom:6px; }

.confetti-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.confetti { position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; opacity:0.9; animation-name:confetti-fall; animation-iteration-count:infinite; animation-timing-function:linear; }
@keyframes confetti-fall {
  0%   { transform:translateY(-20px) rotate(0deg); opacity:0; }
  10%  { opacity:0.95; }
  100% { transform:translateY(640px) rotate(540deg); opacity:0.2; }
}
</style>
</head>
<body>

<div id="ui" style="display:none">
  <div class="hp-group">
    <div class="hp-wrap"><div id="player-hp-bar" style="width:100%;background:rgb(60,200,40)"></div></div>
    <span id="player-hp-text" class="hp-num">120</span>
  </div>
  <div id="status">WASD 이동 &nbsp;|&nbsp; 스페이스 / 클릭 줍기·던지기</div>
  <div class="hp-group">
    <span id="npc-hp-text" class="hp-num" style="text-align:right;">120</span>
    <div class="hp-wrap"><div id="npc-hp-bar" style="width:100%;background:rgb(60,200,40)"></div></div>
  </div>
</div>

<div class="wrap">
<canvas id="gameCanvas"></canvas>
<div id="overlay"></div>
</div>

<script type="module" src="./game-logic.js"></script>
</body>
</html>
