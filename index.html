<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피구 게임</title>
<link rel="icon" type="image/png" href="./design/assets/images/ball_basic.png">

<style>
@font-face {
  font-family: 'PFStardust';
  src: url('./design/assets/fonts/PFStardust.ttf') format('truetype');
  font-display: block;
}
@font-face {
  font-family: 'PFStardustExtraBold';
  src: url('./design/assets/fonts/PFStardustExtraBold.ttf') format('truetype');
  font-display: block;
}
/* 게임 화면 비율(내부 해상도 1200x768)과 상단 UI 바 높이 예약값 */
:root { --game-ar: 1200 / 768; --ui-h: 48px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; font-family: 'PFStardust', sans-serif; }
#gameCanvas { display: block; width: 100%; height: 100%; border-radius: 12px; border: 1px solid #333; }
#ui { color: #ccc; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: min(100vw, calc((100vh - var(--ui-h)) * var(--game-ar))); max-width: 100vw; }
.hp-group { display:flex; align-items:center; gap:6px; }
.hp-wrap { width: 200px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 4px; position: relative; flex-shrink: 0; }
.hp-num { font-size:14px; color:#aaa; min-width:32px; }
#player-hp-bar { height: 100%; border-radius: 4px; }
#npc-hp-bar { height: 100%; border-radius: 4px; position: absolute; right: 0; }
#status { font-size: 14px; color: #888; text-align: center; }
#overlay { position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,0.72);border-radius:12px;overflow:hidden; }
#overlay h2 { color:#fff;font-size:22px;font-weight:500; }
#overlay p  { color:rgba(255,255,255,0.78);font-size:15px; }
.ov-btn { padding:11px 30px;border:1.5px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.12);color:#fff;border-radius:10px;font-size:16px;cursor:pointer;font-family:'PFStardust',sans-serif;letter-spacing:0.5px;transition:background .15s, border-color .15s, transform .12s; }
.ov-btn:hover { background:rgba(255,255,255,0.28);transform:translateY(-1px); }
.ov-btn.primary { background:rgba(255,210,90,0.18);border-color:rgba(255,210,90,0.7);color:#FFE3A0; }
.ov-btn.primary:hover { background:rgba(255,210,90,0.32); }
/* 화면에 꽉 차게 — 가로/세로 중 먼저 닿는 쪽 기준, 3:2 비율 유지 */
.wrap { position:relative; width: min(100vw, calc((100vh - var(--ui-h)) * var(--game-ar))); aspect-ratio: var(--game-ar); }

/* 1) 시작 화면 */
.ov-start { gap: 0; padding: 0; flex-direction: column; justify-content: flex-start; align-items: stretch; }
.start-top { height: 30%; overflow:hidden; display:flex; justify-content:center; align-items:flex-end; cursor:pointer; }
.start-top img { display:block; max-width:100%; image-rendering:pixelated; transform:translateY(5%); filter:drop-shadow(0 0 24px rgba(255,210,90,0.25)); }
.start-mid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; cursor:pointer; user-select:none; }
.start-cta { display:flex; flex-direction:column; align-items:center; gap:10px; color:#FFE3A0; font-family:'PFStardust',sans-serif; letter-spacing:4px; font-size:26px; text-shadow:0 0 0 rgba(255,210,90,0); transition:text-shadow 0.18s, transform 0.18s, color 0.18s; }
.start-cta .arrow { font-size:34px; line-height:1; opacity:0.85; transition:transform 0.18s; }
.start-mid:hover .start-cta { color:#fff8d8; text-shadow:0 0 14px rgba(255,210,90,0.9), 0 0 28px rgba(255,210,90,0.55); transform:translateY(-2px); }
.start-mid:hover .start-cta .arrow { transform:translateY(-4px); }
.start-bot { height:30%; overflow:hidden; position:relative; display:flex; justify-content:center; align-items:flex-start; }
.start-bot img { display:block; max-width:100%; image-rendering:pixelated; transform:translateY(5%); }

/* ── 공용 무대(stage): 하단 대사 패널 + 우측 캐릭터 — 층 진입/패배/승리 공용 ── */
#overlay.ov-intro, #overlay.ov-defeat, #overlay.ov-victory { display:block; padding:0; }

/* 상단 층 타이틀 */
.stage-title { position:absolute; top:22px; left:0; right:0; text-align:center; color:rgba(255,210,90,0.95); font-size:20px; letter-spacing:4px; z-index:3; }

/* 중앙 콘텐츠(헤드라인/카드/버튼) — 하단 바 위 공간에 배치 */
.stage-center { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:76px 48px 340px; pointer-events:none; }
.stage-center > * { pointer-events:auto; }

/* 좌우 네비 화살표 (층 진입 전용) */
.stage-nav { position:absolute; top:44%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:0; cursor:pointer; color:#fff; font-size:62px; line-height:1; padding:6px 16px; user-select:none; opacity:0.88; text-shadow:0 2px 12px rgba(0,0,0,0.6); transition:color .15s, opacity .15s; z-index:4; font-family:'PFStardust',sans-serif; }
.stage-nav:hover { color:#FFE3A0; opacity:1; }
.stage-nav.left  { left:20px;  animation:nav-bob-left 1.1s ease-in-out infinite; }
.stage-nav.right { right:20px; animation:nav-bob-right 1.1s ease-in-out infinite; }
.stage-nav.hidden { visibility:hidden; }
.stage-nav .nav-label { font-size:16px; letter-spacing:1px; color:#FFE3A0; }
@keyframes nav-bob-left  { 0%,100%{transform:translate(0,-50%);} 50%{transform:translate(-10px,-50%);} }
@keyframes nav-bob-right { 0%,100%{transform:translate(0,-50%);} 50%{transform:translate(10px,-50%);} }

/* 하단 무대: 우측 캐릭터(상단 80% 노출) + 풀폭 대사 패널 */
.stage-bottom { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:flex-end; pointer-events:none; }
.stage-sprite { height:420px; width:auto; margin-right:7%; margin-bottom:-84px; position:relative; z-index:1; image-rendering:pixelated; filter:drop-shadow(0 8px 20px rgba(0,0,0,0.55)); animation:stage-sprite-in .32s ease; }
@keyframes stage-sprite-in { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
/* 대사 패널: 검은색에 가까운 회색 + 상단 골드 보더, 텍스트 우측 정렬 */
.stage-dialogue { position:relative; z-index:2; width:100%; background:rgba(30,30,32,0.95); border-top:2px solid rgba(255,210,90,0.5); padding:24px 120px 28px 64px; text-align:right; pointer-events:auto; }
.stage-speaker { color:#FFE3A0; font-size:17px; letter-spacing:2px; margin-bottom:8px; }
.stage-text { color:#fff; font-size:21px; line-height:1.6; white-space:pre-line; max-width:1000px; margin-left:auto; }
#overlay.ov-intro .stage-text { min-height:6.4em; }   /* 층 진입만 4줄 고정 */
.stage-dots { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.stage-dots .dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.25); transition:background .15s; }
.stage-dots .dot.on { background:#FFE3A0; }
/* 패널 내 액션 버튼 (패배 재시작 / 승리 다음 층) */
.stage-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:18px; }

/* 컷신/엔딩 상단 타이틀 */
.floor-title { color:rgba(255,210,90,0.9); font-size:17px; letter-spacing:3px; }

/* ── 결과 헤드라인(패배/승리 공용) ── */
#overlay .result-headline { font-size:34px; font-weight:600; letter-spacing:1px; }
.result-headline.lose { color:#FF8B8B; text-shadow:0 2px 18px rgba(255,80,80,0.35); }
.result-headline.win  { color:#FFE3A0; text-shadow:0 2px 18px rgba(255,210,90,0.4); }
#overlay .result-sub { color:rgba(255,255,255,0.78); font-size:16px; margin-top:2px; }

/* ── 승리 화면 — 업그레이드 카드 ── */
#overlay .card-hint { color:rgba(255,255,255,0.78); font-size:16px; margin-top:2px; }
.card-row { display:flex; gap:16px; }
.upgrade-card { width:172px; padding:20px 16px; background:rgba(30,30,32,0.9); border:2px solid rgba(255,255,255,0.18); border-radius:14px; color:#fff; cursor:pointer; font-family:'PFStardust',sans-serif; transition:transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s; display:flex; flex-direction:column; align-items:center; gap:8px; }
.upgrade-card:hover { transform:scale(1.07); border-color:rgba(255,210,90,1); background:rgba(30,30,32,0.96); box-shadow:0 0 14px rgba(255,210,90,0.6), 0 0 32px rgba(255,210,90,0.25); }
.card-emoji { font-size:36px; }
.card-title { font-size:16px; font-weight:600; }
.card-desc  { font-size:14px; color:rgba(255,255,255,0.72); }
.card-desc b { color:#FFE3A0; }
.buff-status { font-size:13px; color:rgba(255,255,255,0.5); letter-spacing:0.5px; }

/* 5) 엔딩 화면 — 탑 정복 + 최종 스탯 */
.final-panel { width:340px; padding:18px 22px; background:rgba(30,30,32,0.92); border:1.5px solid rgba(255,210,90,0.45); border-radius:14px; display:flex; flex-direction:column; gap:9px; }
.final-panel-title { color:#FFE3A0; font-size:15px; letter-spacing:2px; text-align:center; margin-bottom:4px; }
.stat-row { display:flex; justify-content:space-between; align-items:center; font-size:16px; color:#eee; }
.stat-name { color:rgba(255,255,255,0.82); }
.stat-val { font-family:'PFStardustExtraBold','PFStardust',sans-serif; color:#fff; }
.stat-bonus { color:#9BE88B; font-size:14px; margin-left:4px; }
.final-buff-count { margin-top:6px; text-align:center; font-size:13px; color:rgba(255,255,255,0.5); letter-spacing:0.5px; }
.final-playtime { text-align:center; font-size:15px; color:rgba(255,220,100,0.85); letter-spacing:0.5px; margin-top:2px; }
/* 엔딩 컷신 — 무대와 동일 팔레트(검은 회색 패널 + 골드 보더), 중앙 시네마틱 */
.cine-stage { display:flex; flex-direction:column; align-items:center; gap:22px; max-width:640px; padding:8px 24px; animation:cine-in 0.35s ease; }
@keyframes cine-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.cine-emoji { font-size:88px; line-height:1; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
.cine-img { height:240px; width:auto; image-rendering:pixelated; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.55)); }
.cine-caption { background:rgba(30,30,32,0.92); border:1.5px solid rgba(255,210,90,0.35); border-radius:14px; padding:18px 28px; font-size:19px; line-height:1.6; text-align:center; white-space:pre-line; max-width:580px; }
.cine-caption.narr { color:rgba(255,255,255,0.82); font-style:italic; }
.cine-caption.speech { color:#fff; }
.cine-speaker { display:block; color:#FFE3A0; font-size:15px; letter-spacing:1px; margin-bottom:8px; }

.confetti-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.confetti { position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; opacity:0.9; animation-name:confetti-fall; animation-iteration-count:infinite; animation-timing-function:linear; }
@keyframes confetti-fall {
  0%   { transform:translateY(-20px) rotate(0deg); opacity:0; }
  10%  { opacity:0.95; }
  100% { transform:translateY(640px) rotate(540deg); opacity:0.2; }
}
</style>
</head>
<body>

<div id="ui" style="display:none">
  <div class="hp-group">
    <div class="hp-wrap"><div id="player-hp-bar" style="width:100%;background:rgb(60,200,40)"></div></div>
    <span id="player-hp-text" class="hp-num">120</span>
  </div>
  <div id="status">WASD 이동 &nbsp;|&nbsp; 스페이스 / 클릭 줍기·던지기</div>
  <div class="hp-group">
    <span id="npc-hp-text" class="hp-num" style="text-align:right;">120</span>
    <div class="hp-wrap"><div id="npc-hp-bar" style="width:100%;background:rgb(60,200,40)"></div></div>
  </div>
</div>

<div class="wrap">
<canvas id="gameCanvas"></canvas>
<div id="overlay"></div>
</div>

<script type="module" src="./game-logic.js"></script>
</body>
</html>
